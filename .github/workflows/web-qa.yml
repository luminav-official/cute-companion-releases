name: Website browser verification
on:
  workflow_dispatch:
    inputs:
      tag:
        description: Draft containing the exact static website export
        type: string
        required: true
      sha256:
        description: Expected SHA-256 of website-preview.zip
        type: string
        required: true
permissions:
  contents: write
jobs:
  browser:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    env:
      GH_TOKEN: ${{ github.token }}
      RELEASE_TAG: ${{ inputs.tag }}
      EXPECTED_SHA: ${{ inputs.sha256 }}
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Download exact static export
        run: |
          gh release download "$RELEASE_TAG" --repo "$GITHUB_REPOSITORY" --pattern website-preview.zip
          printf '%s  website-preview.zip\n' "$EXPECTED_SHA" | sha256sum --check
          mkdir site
          unzip -q website-preview.zip -d site
      - name: Install browser verification tools
        run: |
          npm install --no-save playwright@1.63.0 agent-browser@0.38.1
          npx playwright install --with-deps chromium
          npx agent-browser install --with-deps
      - name: Verify desktop, mobile, keyboard and reduced motion
        run: node qa-web.mjs
      - name: Preserve screenshots and results on the draft
        if: always()
        run: |
          find . -maxdepth 1 -name 'qa-web-*' -type f -print0 | xargs -0 -r gh release upload "$RELEASE_TAG" --repo "$GITHUB_REPOSITORY"
